# Builds the site (landing + example tools + component registry) and deploys it
# to GitHub Pages on every push to main. Pull requests build and check only.
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".
name: Site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Generated files are up to date
        run: node scripts/sync.mjs --check
      - name: Unit tests
        run: npm test
      - name: Pages base path
        id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Build
        run: npm run build
        env:
          # /<repo>/ for a project site, / for a custom domain or a PR build
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
