<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rueca</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- sharing: the copy is site.config.ts's tagline and description; the image is Rafael's (public/og-v1.jpg,
         1200×630). Bump the file's version for a new image so the networks' caches pick it up. -->
    <meta name="description" content="Teaches your agent to wrap what you’ve already built in a design tool: inspector, timeline, layers, export and a client view. Ships as an agent skill, a Claude Code plugin and a component registry." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Rueca" />
    <meta property="og:url" content="https://rueca.dev/" />
    <meta property="og:title" content="Rueca: Spin your prototype into a tool." />
    <meta property="og:description" content="Teaches your agent to wrap what you’ve already built in a design tool: inspector, timeline, layers, export and a client view. Ships as an agent skill, a Claude Code plugin and a component registry." />
    <meta property="og:image" content="https://rueca.dev/og-v1.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The Rueca logo over the line Spin your prototype into a tool, with prototype underlined and tool circled in pen" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Rueca: Spin your prototype into a tool." />
    <meta name="twitter:description" content="Teaches your agent to wrap what you’ve already built in a design tool: inspector, timeline, layers, export and a client view. Ships as an agent skill, a Claude Code plugin and a component registry." />
    <meta name="twitter:image" content="https://rueca.dev/og-v1.jpg" />
    <script>
      // Resolve the theme before first paint so the stored choice never flashes.
      try {
        var t = localStorage.getItem('studio:theme');
        var dark = t ? t === 'dark' : true; // dark unless the visitor picked light (Rafael, 11 Oct: back to dark)
        document.documentElement.classList.add(dark ? 'dark' : 'light');
      } catch (e) { document.documentElement.classList.add('dark'); }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
