<!doctype html><meta charset="utf-8"><title>Wordmark · free sans</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500&display=swap"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&display=swap"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400..700&display=swap"><link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=switzer@400,500,600,700&display=swap"><link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600,700&display=swap"><link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,600,700&display=swap"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400..700&display=swap"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400..700&display=swap"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400..700&display=swap"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Host+Grotesk:wght@400..700&display=swap"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400..700&display=swap"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mona+Sans:wght@400..700&display=swap"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400..700&display=swap"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400..700&display=swap"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400..700&display=swap"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400..700&display=swap"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400..700&display=swap"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400..700&display=swap"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400..700&display=swap"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400..700&display=swap"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..700&display=swap"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400..700&display=swap"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400..700&display=swap"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kumbh+Sans:wght@400..700&display=swap"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@400..700&display=swap"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@400..700&display=swap"><link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=supreme@400,500,600,700&display=swap"><link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@400,500,600,700&display=swap"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Funnel+Display:wght@400..700&display=swap"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gantari:wght@400..700&display=swap"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400..700&display=swap"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400..700&display=swap"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400..700&display=swap"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Varela+Round&display=swap"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700&display=swap"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400..700&display=swap"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400..700&display=swap"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400..700&display=swap"><link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=chillax@400,500,600,700&display=swap"><link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=pally@400,500,600,700&display=swap"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400..700&display=swap"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400..700&display=swap">
<style>
:root{--bg:#f3f1eb;--card:#faf8f4;--ink:#181411;--mute:#58524d;--line:rgba(24,20,17,.13)}
:root.dark{--bg:#151210;--card:#201c19;--ink:#f3f1eb;--mute:#b9b3ac;--line:rgba(243,241,235,.13)}
body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.45 "IBM Plex Sans",system-ui;padding:0 18px 40px}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 0;display:flex;flex-wrap:wrap;gap:16px;align-items:center}
.bar b{font-weight:500} .bar label{display:flex;gap:6px;align-items:center;color:var(--mute)} .bar output{width:34px;color:var(--ink);font-variant-numeric:tabular-nums}
h2{font-weight:500;font-size:15px;margin:22px 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:12px 14px 14px;cursor:pointer} .card.pick{outline:2px solid #E8582C;outline-offset:-2px}
.card .hd{display:flex;justify-content:space-between;color:var(--mute);font-size:12px;margin-bottom:10px} .card .hd b{color:var(--ink);font-weight:500}
.lock{display:inline-flex;align-items:flex-start;white-space:nowrap} .lock svg{flex:none;display:block}
.word{line-height:1;font-synthesis:none}
.small{margin-top:12px;display:flex;gap:18px;align-items:center}
</style>
<div class="bar"><b>Wordmark · free sans</b>
<label>weight <input id="w" type="range" min="300" max="700" step="50" value="500"><output></output></label>
<label>x-height × <input id="x" type="range" min="0.7" max="1.05" step="0.01" value="0.9"><output></output></label>
<label>tracking <input id="t" type="range" min="-0.06" max="0.04" step="0.005" value="-0.01"><output></output></label>
<label>gap × <input id="gp" type="range" min="0.3" max="0.9" step="0.01" value="0.54"><output></output></label>
<label><input id="c" type="checkbox" checked> colour</label><label><input id="d" type="checkbox"> dark</label>
<span style="color:var(--mute)">Click cards to shortlist (orange). The word's x-height is centred on the mark. x-height × 1 = as tall as the band's inner box.</span></div>
<div id="out"></div>
<script>
function alignLocks(){const c=document.createElement('canvas').getContext('2d');document.querySelectorAll('.lock').forEach(l=>{const m=l.querySelector('svg'),w=l.querySelector('.word');if(!m||!w)return;const cs=getComputedStyle(w),fs=parseFloat(cs.fontSize);c.font=`${cs.fontWeight} ${fs}px ${cs.fontFamily}`;const t=c.measureText('rueca'),asc=t.fontBoundingBoxAscent,des=t.fontBoundingBoxDescent,xh=c.measureText('x').actualBoundingBoxAscent;const lh=fs;const baseInBox=(lh-(asc+des))/2+asc;const h=m.getBoundingClientRect().height;m.style.marginBottom='0px';w.style.marginTop=((h/2+xh/2)-baseInBox)+'px'})}

const GROUPS=[["Swiss / neo-grotesk", [["Geist", "Google \u00b7 OFL"], ["Inter Tight", "Google \u00b7 OFL"], ["Switzer", "Fontshare \u00b7 free"], ["General Sans", "Fontshare \u00b7 free"], ["Satoshi", "Fontshare \u00b7 free"], ["Schibsted Grotesk", "Google \u00b7 OFL"], ["Instrument Sans", "Google \u00b7 OFL"], ["Hanken Grotesk", "Google \u00b7 OFL"], ["Host Grotesk", "Google \u00b7 OFL"], ["Onest", "Google \u00b7 OFL"], ["Mona Sans", "Google \u00b7 OFL"], ["Albert Sans", "Google \u00b7 OFL"], ["Familjen Grotesk", "Google \u00b7 OFL"], ["Space Grotesk", "Google \u00b7 OFL"]]], ["Geometric", [["Jost", "Google \u00b7 OFL"], ["Outfit", "Google \u00b7 OFL"], ["Urbanist", "Google \u00b7 OFL"], ["Poppins", "Google \u00b7 OFL"], ["Figtree", "Google \u00b7 OFL"], ["DM Sans", "Google \u00b7 OFL"], ["Manrope", "Google \u00b7 OFL"], ["Plus Jakarta Sans", "Google \u00b7 OFL"], ["Lexend", "Google \u00b7 OFL"], ["Kumbh Sans", "Google \u00b7 OFL"], ["League Spartan", "Google \u00b7 OFL"], ["Red Hat Display", "Google \u00b7 OFL"], ["Supreme", "Fontshare \u00b7 free"], ["Cabinet Grotesk", "Fontshare \u00b7 free"], ["Funnel Display", "Google \u00b7 OFL"], ["Gantari", "Google \u00b7 OFL"], ["Readex Pro", "Google \u00b7 OFL"]]], ["Round / playful", [["Nunito", "Google \u00b7 OFL"], ["Quicksand", "Google \u00b7 OFL"], ["Varela Round", "Google \u00b7 OFL"], ["M PLUS Rounded 1c", "Google \u00b7 OFL"], ["Baloo 2", "Google \u00b7 OFL"], ["Rubik", "Google \u00b7 OFL"], ["Comfortaa", "Google \u00b7 OFL"], ["Chillax", "Fontshare \u00b7 free"], ["Pally", "Fontshare \u00b7 free"], ["Bricolage Grotesque", "Google \u00b7 OFL"], ["Unbounded", "Google \u00b7 OFL"]]]], M={"vb": [309.1, 217.2], "wheel": "M139.4 108.6A61.1 61.1 0 1 0 261.6 108.6A61.1 61.1 0 1 0 139.4 108.6Z", "whorl": "M47.5 140.7A29 29 0 1 0 105.5 140.7A29 29 0 1 0 47.5 140.7Z", "band": "M200.5 217.2L76.5 217.2A76.5 76.5 0 0 1 39.38 73.81L147.8 13.64A108.6 108.6 0 1 1 200.5 217.2ZM200.5 192.2L76.5 192.2A51.5 51.5 0 0 1 51.51 95.67L159.94 35.5A83.6 83.6 0 1 1 200.5 192.2Z"}
const $=(s)=>document.querySelector(s)
const BAND=25, H=M.vb[1], XH=167.2 // band inner box in mark units
function measureXH(fam,w){const c=document.createElement('canvas').getContext('2d');c.font=`${w} 200px "${fam}"`;return c.measureText('x').actualBoundingBoxAscent/200}
function lockup(fam, hpx){
  const w=+$('#w').value, xs=+$('#x').value, tr=+$('#t').value, gk=+$('#gp').value, col=$('#c').checked, dark=$('#d').checked
  const k=hpx/H, xhpx=XH*xs*k, ratio=measureXH(fam,w)||0.5
  const fs=xhpx/ratio
  const dye=col?(dark?['#B39AF8','#F06A3E','#F5D05A']:['#A88BF6','#E8582C','#F2C744']):['currentColor','currentColor','currentColor']
  const svg=`<svg viewBox="0 0 ${M.vb[0]} ${M.vb[1]}" height="${hpx}" width="${M.vb[0]*k}"  fill-rule="evenodd"><path fill="${dye[0]}" d="${M.wheel}"/><path fill="${dye[1]}" d="${M.whorl}"/><path fill="${dye[2]}" d="${M.band}"/></svg>`
  return `<span class="lock" style="gap:${XH*xs*gk*k}px">${svg}<span class="word" style="font-family:'${fam}';font-weight:${w};font-size:${fs}px;letter-spacing:${tr}em">rueca</span></span>`
}
const picks=new Set(JSON.parse(localStorage.getItem('ws-picks')||'[]'))
function render(){setTimeout(alignLocks,0);
  document.documentElement.classList.toggle('dark',$('#d').checked)
  document.querySelectorAll('.bar output').forEach(o=>o.textContent=o.previousElementSibling.value)
  $('#out').innerHTML=GROUPS.map(([g,fs])=>`<h2>${g}</h2><div class="grid">${fs.map(([n,lic])=>`<div class="card ${picks.has(n)?'pick':''}" data-n="${n}"><div class="hd"><b>${n}</b><span>${lic}</span></div>${lockup(n,56)}<div class="small">${lockup(n,18)}${lockup(n,24)}</div></div>`).join('')}</div>`).join('')
}
document.querySelectorAll('.bar input').forEach(i=>i.addEventListener('input',render))
$('#out').addEventListener('click',e=>{const c=e.target.closest('.card');if(!c)return;const n=c.dataset.n;picks.has(n)?picks.delete(n):picks.add(n);try{localStorage.setItem('ws-picks',JSON.stringify([...picks]))}catch(_){};render()})
render(); document.fonts.ready.then(render); setTimeout(render,1500)
</script>
