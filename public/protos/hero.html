<!doctype html>
<!-- A client's existing landing-page hero. Plain HTML/CSS/JS, no framework.
     The only addition for the harness is studio-bridge.js + 6 lines at the bottom. -->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Northwind — hero prototype</title>
<style>
  :root { --bg: #f4f1ea; --ink: #1d1b16; --accent: #ff5a1f; --radius: 18px; --headline-size: 76px; --gap: 28px; --blob-speed: 14; --tilt: 0; }
  * { box-sizing: border-box; margin: 0 }
  html, body { height: 100% }
  body { font-family: Georgia, "Times New Roman", serif; background: var(--bg); color: var(--ink); overflow: hidden }
  nav { display: flex; justify-content: space-between; align-items: center; padding: 22px 40px; font: 500 14px/1 ui-sans-serif, system-ui, sans-serif }
  nav .logo { font: 700 18px/1 ui-sans-serif, system-ui; letter-spacing: -0.02em }
  nav .links { display: flex; gap: 26px; opacity: .7 }
  nav .cta { background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 999px }
  main { position: relative; display: grid; grid-template-columns: 1.1fr .9fr; align-items: center; gap: var(--gap); padding: 40px 40px 0; height: calc(100% - 64px) }
  h1 { font-size: var(--headline-size); line-height: .98; letter-spacing: -0.035em; font-weight: 400 }
  h1 em { color: var(--accent); font-style: italic }
  p.lede { margin-top: 22px; max-width: 460px; font: 400 18px/1.5 ui-sans-serif, system-ui; opacity: .72 }
  .actions { margin-top: 30px; display: flex; gap: 12px; font: 500 15px/1 ui-sans-serif, system-ui }
  .actions a { padding: 15px 22px; border-radius: var(--radius); text-decoration: none }
  .primary { background: var(--accent); color: #fff }
  .secondary { color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--ink) }
  .art { position: relative; height: 78%; border-radius: calc(var(--radius) * 2); overflow: hidden; background: var(--ink); transform: rotate(calc(var(--tilt) * 1deg)) }
  .blob { position: absolute; width: 70%; aspect-ratio: 1; border-radius: 50%; filter: blur(30px); mix-blend-mode: screen; animation: drift calc(var(--blob-speed) * 1s) ease-in-out infinite alternate }
  .b1 { background: var(--accent); left: -10%; top: 10% }
  .b2 { background: #6c5cff; right: -15%; top: 30%; animation-delay: -4s }
  .b3 { background: #2fd4a8; left: 20%; bottom: -25%; animation-delay: -8s }
  .card { position: absolute; left: 8%; right: 8%; bottom: 8%; padding: 18px 20px; border-radius: var(--radius); background: rgba(255,255,255,.12); backdrop-filter: blur(16px); color: #fff; font: 500 14px/1.4 ui-sans-serif, system-ui }
  @keyframes drift { to { transform: translate(18%, -12%) scale(1.15) } }
  @media (max-width: 760px) { main { grid-template-columns: 1fr; padding: 24px } h1 { font-size: calc(var(--headline-size) * .55) } nav .links { display: none } .art { height: 300px } }
</style>
</head>
<body>
  <nav><span class="logo">Northwind</span><span class="links"><span>Product</span><span>Pricing</span><span>Journal</span></span><span class="cta">Get started</span></nav>
  <main>
    <section>
      <h1 id="headline">Freight that <em>moves</em> like software.</h1>
      <p class="lede" id="lede">Book, track and settle every shipment in one place — with prices that update as fast as the road does.</p>
      <div class="actions"><a class="primary" href="#">Start shipping</a><a class="secondary" href="#">Talk to sales</a></div>
    </section>
    <div class="art"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="card">412 trucks moving right now · avg. quote 38s</div></div>
  </main>

  <!-- the harness hook-up -->
  <script src="../studio-bridge.js"></script>
  <script>
    studio.cssVars({ unitless: ['blobSpeed', 'tilt'] })
    studio.on(function (v) {
      if (v.headline != null) document.getElementById('headline').innerHTML = v.headline.replace(/\*(.+?)\*/g, '<em>$1</em>')
      if (v.lede != null) document.getElementById('lede').textContent = v.lede
    })
  </script>
</body>
</html>
